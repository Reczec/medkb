name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: medkb
          POSTGRES_PASSWORD: medkb
          POSTGRES_DB: medkb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medkb -d medkb_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://medkb:medkb@localhost:5432/medkb_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t medkb:ci .
      - name: Start the container like Render does (own PORT, demo mode, SQLite)
        run: |
          docker run -d --name medkb -p 9000:9000 -e PORT=9000 -e DEMO_MODE=true \
            -e JWT_SECRET=ci-secret-that-is-at-least-32-characters-long \
            -e DATABASE_URL=sqlite:////tmp/medkb.db medkb:ci
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9000/api/health && break
            sleep 1
          done
      - name: Health, web UI and demo login answer
        run: |
          curl -fsS http://127.0.0.1:9000/api/health | grep -q '"ok"'
          curl -fsS http://127.0.0.1:9000/ | grep -q MedKB
          curl -fsSI http://127.0.0.1:9000/ | grep -qi 'x-content-type-options: nosniff'
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"role":"patient"}' \
            http://127.0.0.1:9000/api/auth/demo | grep -q access_token
      - if: failure()
        run: docker logs medkb

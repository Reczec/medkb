# Render Blueprint for the public MedKB demo (Dashboard: New -> Blueprint -> this repository).
# The database is Neon Postgres (Render's free Postgres expires after 30 days).
# Values marked "sync: false" are secrets: Render asks for them once, they never live in Git.
services:
  - type: web
    name: medkb
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      # Neon connection string, e.g. postgresql://user:password@host/medkb?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Stable signing key, generated once by Render; logins survive restarts and deploys.
      - key: JWT_SECRET
        generateValue: true
      # Public demo: one-click roles; the example data is restored on start and every 3 hours.
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_RESET_HOURS
        value: "3"
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-3.5-flash-lite
      - key: ICD_CLIENT_ID
        sync: false
      - key: ICD_CLIENT_SECRET
        sync: false
      - key: NCBI_API_KEY
        sync: false
      # Header carrying the visitor's IP, written by Render's edge: enter True-Client-IP and
      # spoof-test it live (README, Deployment). Empty = all visitors share one AI quota.
      - key: CLIENT_IP_HEADER
        sync: false
